kind = "web"
previewPath = "/"
title = "Showroom Dashboard"
version = "1.0.0"
id = "artifacts/showroom"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25771

[services.development]
run = "pnpm --filter @workspace/showroom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/showroom", "run", "build" ]
publicDir = "artifacts/showroom/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25771"
BASE_PATH = "/"
